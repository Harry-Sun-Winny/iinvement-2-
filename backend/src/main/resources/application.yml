spring:
  application:
    name: investment-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/investment}
    username: ${SPRING_DATASOURCE_USERNAME:investment}
    password: ${SPRING_DATASOURCE_PASSWORD:investment_dev_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:local-development-secret-change-before-production}
    ttl-minutes: ${SECURITY_JWT_TTL_MINUTES:360}
  refresh-token:
    ttl-days: ${SECURITY_REFRESH_TOKEN_TTL_DAYS:30}
  bootstrap-admin:
    enabled: ${SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${SECURITY_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${SECURITY_BOOTSTRAP_ADMIN_FULL_NAME:Local Administrator}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

news:
  ingestion:
    enabled: ${NEWS_INGESTION_ENABLED:true}
    cron: ${NEWS_INGESTION_CRON:0 */15 * * * *}
    max-articles-per-run: ${NEWS_MAX_ARTICLES:30}
    retention-days: ${NEWS_RETENTION_DAYS:1}
  rss:
    feeds:
      - url: https://www.coindesk.com/arc/outboundfeeds/rss/
        source: CoinDesk
      - url: https://feeds.reuters.com/reuters/businessNews
        source: Reuters

journal:
  attachments:
    storage-root: ${JOURNAL_ATTACHMENTS_STORAGE_ROOT:./work/journal-attachments}
    max-file-size-bytes: ${JOURNAL_ATTACHMENTS_MAX_FILE_SIZE_BYTES:10485760}

fmp:
  api:
    key: ${FMP_API_KEY:}

finnhub:
  api:
    key: ${FINNHUB_API_KEY:}

server:
  error:
    include-message: never
